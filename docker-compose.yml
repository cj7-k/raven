# RAVEN: Redis cache + GraphQL backend + Streamlit chat UI.
#
#   docker compose build
#   docker compose run --rm backend python src/embeddings/embed.py   # first time only
#   docker compose up -d
#
# Then open http://localhost:8501
name: raven

services:
  redis:
    image: redis:7-alpine
    # A pure cache: no disk persistence, capped memory, evict least-recently-used.
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    image: raven-app:latest
    env_file: .env                      # provides GROQ_API_KEY
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # chunks.json, read-only, straight from your project
      - ./data/processed:/app/data/processed:ro
      # vector store lives in a Docker volume (fast, no Windows file-locking issues)
      - chroma_data:/app/data/chroma_db
      # embedding model you already downloaded, so the container never has to fetch it
      - ./models/all-MiniLM-L6-v2:/root/.cache/chroma/onnx_models/all-MiniLM-L6-v2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/graphql?query=%7Bhealth%7D', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: raven-app:latest             # same image the backend builds
    command: ["streamlit", "run", "frontend/app.py",
              "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      RAVEN_API_URL: http://backend:8000/graphql
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
